<svg width="1536" height="1024" viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Terminal not found</title>
<desc>Illustration of a delivery worker sitting near a logistics terminal building with a search icon showing no results</desc>

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#eef3fb"/>
    <stop offset="100%" stop-color="#f8fafc"/>
  </linearGradient>
  <linearGradient id="bldgFace" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f4f7fa"/>
    <stop offset="100%" stop-color="#e3e9ee"/>
  </linearGradient>
  <linearGradient id="bldgRoof" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#38506b"/>
    <stop offset="100%" stop-color="#233246"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#cfe4f2"/>
    <stop offset="100%" stop-color="#a9c9df"/>
  </linearGradient>
  <linearGradient id="doorMetal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fbfcfd"/>
    <stop offset="100%" stop-color="#dde4ea"/>
  </linearGradient>
  <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#3a5878"/>
    <stop offset="100%" stop-color="#22384f"/>
  </linearGradient>
  <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2a3b4d"/>
    <stop offset="100%" stop-color="#18232f"/>
  </linearGradient>
  <linearGradient id="truckBody" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fdfefe"/>
    <stop offset="100%" stop-color="#dfe6eb"/>
  </linearGradient>
  <radialGradient id="bubbleGlow" cx="50%" cy="35%" r="65%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#eef2f6"/>
  </radialGradient>
  <linearGradient id="coneGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ff9d4d"/>
    <stop offset="100%" stop-color="#e97b1f"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2d3d" flood-opacity="0.10"/>
  </filter>
  <filter id="softSmall" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2d3d" flood-opacity="0.12"/>
  </filter>
</defs>

<rect width="1536" height="1024" fill="#ffffff"/>
<ellipse cx="768" cy="430" rx="640" ry="390" fill="url(#sky)"/>

<!-- city skyline left -->
<g fill="#e4e9ef" opacity="0.9">
  <rect x="215" y="350" width="60" height="250"/>
  <rect x="285" y="290" width="72" height="310"/>
  <rect x="368" y="375" width="50" height="225"/>
  <rect x="140" y="415" width="66" height="185"/>
</g>
<!-- city skyline right -->
<g fill="#e4e9ef" opacity="0.9">
  <rect x="1255" y="375" width="55" height="225"/>
  <rect x="1320" y="310" width="72" height="290"/>
  <rect x="1185" y="415" width="55" height="185"/>
  <rect x="1400" y="395" width="60" height="205"/>
</g>

