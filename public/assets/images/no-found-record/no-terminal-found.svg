<svg width="1536" height="1024" viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>No Terminal Found</title>
<desc>Illustration of a delivery worker sitting near a logistics terminal building with a "no data" search icon, and text reading No Terminal Found</desc>

<rect width="1536" height="1024" fill="#ffffff"/>

<!-- soft background blob -->
<ellipse cx="768" cy="420" rx="620" ry="380" fill="#f3f5f8"/>

<!-- city skyline left -->
<g fill="#e7ebef">
  <rect x="230" y="360" width="60" height="240"/>
  <rect x="300" y="300" width="70" height="300"/>
  <rect x="380" y="380" width="50" height="220"/>
  <rect x="150" y="420" width="70" height="180"/>
</g>

<!-- city skyline right -->
<g fill="#e7ebef">
  <rect x="1250" y="380" width="55" height="220"/>
  <rect x="1315" y="320" width="70" height="280"/>
  <rect x="1180" y="420" width="55" height="180"/>
  <rect x="1395" y="400" width="60" height="200"/>
</g>

<!-- clouds -->
<g fill="#eef1f4">
  <ellipse cx="470" cy="200" rx="55" ry="26"/>
  <ellipse cx="510" cy="190" rx="40" ry="22"/>
  <ellipse cx="1080" cy="170" rx="50" ry="24"/>
  <ellipse cx="1120" cy="160" rx="36" ry="20"/>
</g>

<!-- birds -->
<g stroke="#c7cdd4" stroke-width="3" fill="none" stroke-linecap="round">
  <path d="M300 150 q10 -12 20 0 q10 -12 20 0"/>
  <path d="M1240 130 q9 -10 18 0 q9 -10 18 0"/>
</g>

<!-- dashed flight path with paper plane -->
<g fill="none" stroke="#a9b1ba" stroke-width="2.5" stroke-dasharray="6 8">
  <path d="M470 480 C 420 430, 470 360, 420 320 C 380 290, 420 250, 470 220"/>
</g>
<g transform="translate(462,205) rotate(35)">
  <path d="M0 0 L34 10 L0 20 L6 10 Z" fill="#9aa3ac"/>
</g>

<!-- ============ TERMINAL BUILDING ============ -->
<g>
  <!-- ground shadow -->
  <ellipse cx="980" cy="742" rx="290" ry="20" fill="#e3e7eb"/>

  <!-- main terminal block -->
  <rect x="810" y="470" width="340" height="270" rx="6" fill="#eef1f4" stroke="#c7cdd4" stroke-width="2"/>
  <!-- roof strip -->
  <rect x="800" y="452" width="360" height="26" rx="4" fill="#d8dee3" stroke="#c7cdd4" stroke-width="2"/>

  <!-- bay doors -->
  <g>
    <rect x="840" y="560" width="70" height="150" rx="4" fill="#ffffff" stroke="#c7cdd4" stroke-width="2"/>
    <rect x="840" y="560" width="70" height="18" fill="#c7cdd4"/>
    <rect x="840" y="590" width="70" height="4" fill="#dde2e6"/>
    <rect x="840" y="614" width="70" height="4" fill="#dde2e6"/>
    <rect x="840" y="638" width="70" height="4" fill="#dde2e6"/>

    <rect x="930" y="560" width="70" height="150" rx="4" fill="#ffffff" stroke="#c7cdd4" stroke-width="2"/>
    <rect x="930" y="560" width="70" height="18" fill="#c7cdd4"/>
    <rect x="930" y="590" width="70" height="4" fill="#dde2e6"/>
    <rect x="930" y="614" width="70" height="4" fill="#dde2e6"/>
    <rect x="930" y="638" width="70" height="4" fill="#dde2e6"/>
  </g>

  <!-- office window section -->
  <rect x="1030" y="530" width="100" height="80" rx="4" fill="#dbe9f2" stroke="#c7cdd4" stroke-width="2"/>
  <line x1="1080" y1="530" x2="1080" y2="610" stroke="#c7cdd4" stroke-width="2"/>

  <!-- terminal sign -->
  <rect x="900" y="486" width="160" height="34" rx="4" fill="#1f2d3d"/>
  <text x="980" y="509" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">TERMINAL 04</text>

  <!-- small entrance -->
  <rect x="1005" y="670" width="40" height="70" rx="3" fill="#c7cdd4"/>
</g>

<!-- parked truck beside terminal for context -->
<g transform="translate(1160,600)">
  <rect x="0" y="30" width="120" height="80" rx="4" fill="#d8dee3" stroke="#bfc7cd" stroke-width="1.5"/>
  <path d="M120 40 h30 a10 10 0 0 1 10 10 v60 h-40 Z" fill="#eef1f4" stroke="#bfc7cd" stroke-width="1.5"/>
  <rect x="128" y="55" width="20" height="18" rx="2" fill="#bcd3de"/>
  <circle cx="30" cy="112" r="14" fill="#3a4552"/>
  <circle cx="30" cy="112" r="6" fill="#8b95a1"/>
  <circle cx="130" cy="112" r="14" fill="#3a4552"/>
  <circle cx="130" cy="112" r="6" fill="#8b95a1"/>
</g>

<!-- ============ SEARCH / NO-DATA BUBBLE ============ -->
<g transform="translate(1090,150)">
  <circle cx="0" cy="0" r="95" fill="#ffffff" stroke="#dde2e6" stroke-width="2"/>
  <path d="M-30 90 L10 45 L45 65 Z" fill="#ffffff" stroke="#dde2e6" stroke-width="2"/>
  <!-- building icon inside -->
  <rect x="-35" y="-45" width="42" height="80" rx="3" fill="#eef1f4" stroke="#c7cdd4" stroke-width="2"/>
  <rect x="-27" y="-33" width="10" height="12" fill="#c7cdd4"/>
  <rect x="-10" y="-33" width="10" height="12" fill="#c7cdd4"/>
  <rect x="-27" y="-13" width="10" height="12" fill="#c7cdd4"/>
  <rect x="-10" y="-13" width="10" height="12" fill="#c7cdd4"/>
  <rect x="-27" y="7" width="10" height="12" fill="#c7cdd4"/>
  <rect x="-10" y="7" width="10" height="12" fill="#c7cdd4"/>
  <!-- magnifier with x -->
  <circle cx="24" cy="18" r="26" fill="none" stroke="#3a4552" stroke-width="6"/>
  <line x1="43" y1="37" x2="60" y2="54" stroke="#3a4552" stroke-width="7" stroke-linecap="round"/>
  <line x1="14" y1="8" x2="34" y2="28" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <line x1="34" y1="8" x2="14" y2="28" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
</g>

<!-- ============ PERSON (sitting, puzzled) ============ -->
<g transform="translate(610,470)">
  <!-- legs crossed -->
  <path d="M-10 190 Q -70 195 -95 160 Q -100 150 -85 145 Q -60 175 -5 172 Z" fill="#1f2d3d"/>
  <path d="M35 190 Q 95 195 118 158 Q 122 148 108 144 Q 82 172 30 172 Z" fill="#1f2d3d"/>
  <ellipse cx="-95" cy="158" rx="14" ry="10" fill="#111826"/>
  <ellipse cx="118" cy="156" rx="14" ry="10" fill="#111826"/>

  <!-- torso -->
  <path d="M-55 60 Q -60 150 -30 180 L 45 180 Q 70 150 60 60 Q 60 30 20 25 Q -20 20 -55 60 Z" fill="#2f4157"/>

  <!-- collar buttons -->
  <circle cx="5" cy="55" r="3" fill="#1f2d3d"/>
  <circle cx="5" cy="75" r="3" fill="#1f2d3d"/>
  <rect x="0" y="40" width="12" height="55" fill="#26374a"/>

  <!-- pockets -->
  <rect x="-40" y="90" width="26" height="20" rx="2" fill="#26374a"/>
  <rect x="18" y="90" width="26" height="20" rx="2" fill="#26374a"/>

  <!-- left arm bent to face -->
  <path d="M-50 60 Q -80 70 -78 110 Q -76 135 -55 140 Q -45 142 -42 128 Q -55 122 -55 105 Q -55 82 -35 72 Z" fill="#2f4157"/>
  <circle cx="-58" cy="142" r="15" fill="#e8b48a"/>

  <!-- right arm resting on knee -->
  <path d="M55 65 Q 90 85 90 130 Q 90 150 68 152 Q 55 152 55 138 Q 68 135 70 118 Q 72 95 45 78 Z" fill="#2f4157"/>
  <circle cx="70" cy="150" r="15" fill="#e8b48a"/>

  <!-- neck + head -->
  <rect x="-8" y="10" width="20" height="18" fill="#e8b48a"/>
  <circle cx="2" cy="0" r="30" fill="#e8b48a"/>

  <!-- cap -->
  <path d="M-28 -8 Q -30 -38 2 -40 Q 34 -38 32 -8 Q 2 -20 -28 -8 Z" fill="#1f2d3d"/>
  <path d="M-28 -8 Q -10 -16 12 -14 L 20 4 Q -6 6 -30 2 Z" fill="#26374a"/>
  <rect x="18" y="-8" width="22" height="8" rx="3" fill="#1f2d3d"/>

  <!-- puzzled face -->
  <path d="M-13 -3 q5 -6 10 0" stroke="#4a3728" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M9 -6 q5 -4 10 1" stroke="#4a3728" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="-8" cy="4" r="2" fill="#4a3728"/>
  <circle cx="14" cy="2" r="2" fill="#4a3728"/>
  <path d="M-6 16 Q 3 12 10 17" stroke="#4a3728" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</g>

<!-- shadow under person -->
<ellipse cx="640" cy="672" rx="130" ry="16" fill="#e3e7eb"/>

<!-- bottom road with dashes -->
<g>
  <rect x="220" y="900" width="1100" height="14" rx="7" fill="#dde2e6"/>
  <g fill="#ffffff">
    <rect x="260" y="905" width="34" height="4"/>
    <rect x="330" y="905" width="34" height="4"/>
    <rect x="400" y="905" width="34" height="4"/>
    <rect x="470" y="905" width="34" height="4"/>
    <rect x="540" y="905" width="34" height="4"/>
    <rect x="610" y="905" width="34" height="4"/>
