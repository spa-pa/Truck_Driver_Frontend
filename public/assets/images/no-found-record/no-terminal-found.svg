    <rect x="750" y="905" width="34" height="4"/>
    <rect x="820" y="905" width="34" height="4"/>
    <rect x="890" y="905" width="34" height="4"/>
    <rect x="960" y="905" width="34" height="4"/>
    <rect x="1030" y="905" width="34" height="4"/>
    <rect x="1100" y="905" width="34" height="4"/>
    <rect x="1170" y="905" width="34" height="4"/>
    <rect x="1240" y="905" width="34" height="4"/>
  </g>
</g>

<!-- traffic cone -->
<g transform="translate(235,860)">
  <rect x="-22" y="38" width="44" height="10" rx="2" fill="#e07b1f"/>
  <path d="M-16 38 L-3 -8 h6 L-1 38 Z" fill="#f0932b"/>
  <path d="M1 38 L-3 -8 h6 L16 38 Z" fill="#f0932b"/>
  <path d="M-16 38 L16 38 L11 20 L-11 20 Z" fill="#ffffff" opacity="0.9"/>
</g>
<!-- bush near cone -->
<g fill="#c9d6c5">
  <ellipse cx="1330" cy="895" rx="34" ry="16"/>
  <ellipse cx="1360" cy="900" rx="26" ry="12"/>
</g>
<g fill="#c9d6c5">
  <ellipse cx="130" cy="895" rx="30" ry="14"/>
</g>

<!-- ============ TEXT ============ -->
<text x="768" y="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#1f2d3d">No terminal found</text>
<text x="768" y="845" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#6b7684">Looks like there's no terminal to display.</text>
<text x="768" y="872" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#6b7684">Please check back later or try a different search.</text>

</svg>
